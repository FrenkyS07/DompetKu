<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Website DompetKu</title>
</head>

<body>
    <header>
        <div class="navbar-container">
            <nav class="navbar-section">
                <div class="nav-item">
                    <a href="#Section-1">Input Transaksi</a>
                </div>
                <div class="nav-item">
                    <a href="#Section-2">Ringkasan Saldo</a>
                </div>
                <div class="nav-item">
                    <a href="#Section-3">Daftar Riwayat</a>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <section class="Section-1" id="Section-1">
                <div class="card">
                    <div class="placeholder-dashboard">
                        <div class="saldo">
                            <h3>Saldo</h3>
                            <h1 id="saldoAwal" class="text-blue">Rp0</h1>
                        </div>
                        <hr style="display: flex; width: 200px;align-self: center;">
                        <div class="transaksi">
                            <div class="pemasukan">
                                <p>Pemasukan</p>
                                <h4 id="totalPemasukan" class="text-green">Rp0</h4>
                            </div>
                            <hr>
                            <div class="pengeluaran">
                                <p>Pengeluaran</p>
                                <h4 id="totalPengeluaran" class="text-red">Rp0</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="Section-2" id="Section-2">
                <div class="card">
                    <form onsubmit="event.preventDefault();onFormSubmit();" action="" class="form-transaksi">
                        <div class="Input-wrapper">
                            <input type="text" id="namaTransaksi" class="input-transaksi" placeholder="Nama transaksi"
                                required>
                        </div>
                        <div class="Input-wrapper">
                            <input type="text" id="jumlahUang" class="input-transaksi" placeholder="Jumlah Uang"
                                required>
                        </div>
                        <div class="kelompok-transaksi">
                            <div class="select-wrapper">
                                <select name="kategori" id="kategori" class="input-style">
                                    <option value="" disabled selected>Kategori</option>
                                    <option value="Gaji">Gaji</option>
                                    <option value="Makanan">Makanan</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Hiburan">Hiburan</option>
                                    <option value="Elektronik">Elektronik</option>
                                </select>
                            </div>
                            <div class="select-wrapper">
                                <select name="jenis" id="jenis" class="input-style">
                                    <option value="" disabled selected>Jenis</option>
                                    <option value="pemasukan" id="pemasukan">Pemasukan</option>
                                    <option value="pengeluaran" id="pengeluaran">Pengeluaran</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" value="submit" class="btn-submit">Submit</button>
                    </form>
                </div>
            </section>
            <section class="Section-3" id="Section-3">
                <div class="card">
                    <div class="card-history">
                        <div class="table-wrapper">
                            <table class="historyTable" id="tableTransaksi">
                                <thead>
                                    <tr>
                                        <th>Nama transaksi</th>
                                        <th>Jumlah Uang</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="index.js"></script>
</body>

</html>
