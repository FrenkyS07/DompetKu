<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Website DompetKu</title>
</head>

<body>
    <header></header>
    <main>
        <div class="container">
            <section class="Section-1">
                <div class="card">
                    <div class="placeholder-dashboard">
                        <div class="saldo">1.000.000</div>
                        <hr>
                        <div class="transaksi">
                            <div class="pemasukan">1.000.000</div>
                            <hr>
                            <div class="pengeluaran">1.000.000</div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="Section-2">
                <div class="card">
                    <form action="" class="form-transaksi">
                        <div class="Input-wrapper">
                            <input type="text" id="nama-transaksi" class="input-transaksi" placeholder="Nama transaksi" required>
                        </div>
                        <div class="Input-wrapper">
                            <input type="number" id="jumlah-uang" class="input-transaksi" placeholder="Jumlah Uang" required>
                        </div>
                        <div class="kelompok-transaksi">
                            <div class="select-wrapper">
                                <select name="kategori" id="kategori" class="input-style">
                                    <option value="" disabled selected>Kategori</option>
                                    <option value="Gaji">Gaji</option>
                                    <option value="Makanan">Makanan</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Hiburan">Hiburan</option>
                                    <option value="Elektronik">Elektronik</option>
                                </select>
                            </div>
                            <div class="select-wrapper">
                                <select name="jenis" id="jenis" class="input-style">
                                    <option value="" disabled selected>Jenis</option>
                                    <option value="pemasukan">Pemasukan</option>
                                    <option value="pengeluaran">Pengeluaran</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-submit">Submit</button>
                    </form>
                </div>
            </section>
            <section class="Section-3">
                <div class="card">

                </div>
            </section>
        </div>
    </main>
</body>

</html>
