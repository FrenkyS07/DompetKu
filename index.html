<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>DompetKu</title>
</head>

<body>
    <div class="container">
        <main>
            <section class="Section-1">
                <div>
                    <div class="intro">
                        <h1>Welcome to DompetKu</h1>
                        <p>Your personal finance management app.</p>
                    </div>

                    <div class="formTransaksi">
                        <form action="">
                            <div class="card">
                                <label for="name">Masukkan Nama Transaksi</label>
                                <input type="text" id="name" name="name" placeholder="Nama Transaksi" required>
                            </div>
                            <div class="card">
                                <label for="money">Jumlah Uang</label>
                                <input type="number" id="money" name="money" placeholder="Jumlah Uang" required>
                            </div>
                            <div class="card">
                                <label for="choice">Pilih Kategori</label>
                                <div class="radio">
                                    <select name="choice" id="choice">
                                        <option value="default" id="default">Pilih Kategori</option>
                                        <option value="makanan">Makanan</option>
                                        <option value="minuman">Minuman</option>
                                        <option value="transportasi">Transportasi</option>
                                        <option value="gaji">Gaji</option>
                                    </select>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
            <section class="Section-2">

            </section>
        </main>
    </div>
</body>

</html>
